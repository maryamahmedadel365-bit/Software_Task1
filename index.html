<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Members</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      margin: 0;
      padding: 40px 16px;
      color: #222;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
    }
    table {
      border-collapse: collapse;
      margin: 0 auto;
      width: 100%;
      max-width: 600px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
    }
    th {
      background: #4a5fc1;
      color: #fff;
    }
    tr:nth-child(even) td {
      background: #f0f2fa;
    }
  </style>
</head>
<body>
  <h1>Our Team</h1>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>ID</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>1</td><td>Maryam Ahmed Adel</td><td>20240571</td></tr>
   
    </tbody>
  </table>
</body>
</html>
